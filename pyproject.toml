[project]
name = "gzp-finanace"
version = "0.2.0"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1", "scikit-learn>=1.6,<2", "joblib>=1.4,<2",
  "defusedxml>=0.7,<1",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gzp-finance = "gzp_finance.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
gzp_finance = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
